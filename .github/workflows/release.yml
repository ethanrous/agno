name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create git tags and GitHub release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGNO_BUILD_VERSION: ${{ steps.version.outputs.tag }}

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve semantic version
        id: version
        run: |
          # Read baseline major.minor from VERSION file
          BASELINE=$(cat VERSION 2>/dev/null || echo "0.1")

          # Get all tags, sorted by version (latest first)
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [[ "$LATEST_TAG" == v$BASELINE.* ]]; then
            # Same major.minor - increment patch
            PATCH=${LATEST_TAG#v$BASELINE.}
            NEW_PATCH=$((PATCH + 1))
            echo "tag=v${BASELINE}.${NEW_PATCH}" >> "$GITHUB_OUTPUT"
          else
            # Different major.minor or no tags - start at v0.0.1 (or use VERSION)
            echo "tag=v$BASELINE.0" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    name: Build ${{ matrix.output.label }} (${{ matrix.target.platform }}${{ matrix.gpu.suffix }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-x86_64
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-aarch64
          - triple: aarch64-apple-darwin
            runner: macos-latest
            platform: macos-aarch64
        gpu:
          - enabled: true
            features: "gpu,jpeg,png,webp,pdf,gif"
            suffix: "-gpu"
          - enabled: false
            features: "jpeg,png,webp,pdf,gif"
            suffix: ""
        output:
          - label: library
            cargo_flag: "--lib"
            src_file: "libagno.a"
            asset_prefix: "libagno-"
            asset_suffix: ".a"
          - label: executable
            cargo_flag: "--bin agno"
            src_file: "agno"
            asset_prefix: "agno-"
            asset_suffix: ""

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Add target
        run: rustup target add ${{ matrix.target.triple }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}${{ matrix.gpu.suffix }}

      - name: Build
        env:
          TARGET_TRIPLE: ${{ matrix.target.triple }}
          AGNO_FEATURES: ${{ matrix.gpu.features }}
          AGNO_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          if [ "$TARGET_TRIPLE" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          fi
          cargo build --release ${{ matrix.output.cargo_flag }} --no-default-features --features "${AGNO_FEATURES}" --target "${TARGET_TRIPLE}"
          cp "target/${TARGET_TRIPLE}/release/${{ matrix.output.src_file }}" artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output.asset_prefix }}${{ matrix.target.platform }}${{ matrix.gpu.suffix }}${{ matrix.output.asset_suffix }}
          path: artifact

  release:
    name: Create Release
    if: inputs.create_release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version tag
        env:
          GO_TAG: bindings/go/agno/${{ needs.version.outputs.tag }}
        run: |
          echo "GO_TAG=${GO_TAG}" >> "$GITHUB_ENV"

      - name: Create and push tags
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          for TAG in "${{ env.AGNO_BUILD_VERSION }}" "$GO_TAG"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-parse "$TAG")
              if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
                echo "Tag $TAG already exists at current commit, skipping"
              else
                echo "ERROR: Tag $TAG exists but points to a different commit"
                exit 1
              fi
            else
              echo "Creating tag $TAG"
              git tag "$TAG"
            fi
          done
          
          git push origin "${{ env.AGNO_BUILD_VERSION }}" "$GO_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            cp "$dir/artifact" "release/$name"
          done
          ls -lh release/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.AGNO_BUILD_VERSION }}" release/* \
            --title "${{ env.AGNO_BUILD_VERSION }}" \
            --generate-notes
