name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create git tags and GitHub release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGNO_BUILD_VERSION: v0.0.${{ github.run_number }}

jobs:
  build:
    name: Build ${{ matrix.output.label }} (${{ matrix.target.platform }}${{ matrix.gpu.suffix }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-x86_64
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-aarch64
          - triple: aarch64-apple-darwin
            runner: macos-latest
            platform: macos-aarch64
        gpu:
          - enabled: true
            features: "gpu,jpeg,png,webp,pdf,gif"
            suffix: "-gpu"
          - enabled: false
            features: "jpeg,png,webp,pdf,gif"
            suffix: ""
        output:
          - label: library
            cargo_flag: "--lib"
            src_file: "libagno.a"
            asset_prefix: "libagno-"
            asset_suffix: ".a"
          - label: executable
            cargo_flag: "--bin agno"
            src_file: "agno"
            asset_prefix: "agno-"
            asset_suffix: ""

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Add target
        run: rustup target add ${{ matrix.target.triple }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}${{ matrix.gpu.suffix }}

      - name: Build
        env:
          TARGET_TRIPLE: ${{ matrix.target.triple }}
          AGNO_FEATURES: ${{ matrix.gpu.features }}
          AGNO_BUILD_VERSION: ${{ env.AGNO_BUILD_VERSION }}
        run: |
          if [ "$TARGET_TRIPLE" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          fi
          cargo build --release ${{ matrix.output.cargo_flag }} --no-default-features --features "${AGNO_FEATURES}" --target "${TARGET_TRIPLE}"
          cp "target/${TARGET_TRIPLE}/release/${{ matrix.output.src_file }}" artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output.asset_prefix }}${{ matrix.target.platform }}${{ matrix.gpu.suffix }}${{ matrix.output.asset_suffix }}
          path: artifact

  release:
    name: Create Release
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version tag
        env:
          GO_TAG: bindings/go/agno/${{ env.AGNO_BUILD_VERSION }}
        run: |
          echo "GO_TAG=${GO_TAG}" >> "$GITHUB_ENV"

      - name: Create and push tags
        run: |
          git tag "${{ env.AGNO_BUILD_VERSION }}"
          git tag "$GO_TAG"
          git push origin "${{ env.AGNO_BUILD_VERSION }}" "$GO_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            cp "$dir/artifact" "release/$name"
          done
          ls -lh release/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.AGNO_BUILD_VERSION }}" release/* \
            --title "${{ env.AGNO_BUILD_VERSION }}" \
            --generate-notes
