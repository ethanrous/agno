name: Test

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # No GPU in CI — build without gpu feature
  FEATURES: "jpeg,png,webp,pdf"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-script

      - name: Build
        run: ./build/sh/build-agno.bash libagno.a
        env:
          AGNO_FEATURES: "jpeg,png,webp,pdf"

      - name: Verify output
        run: file libagno.a
