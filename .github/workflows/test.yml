name: Test

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # No GPU in CI — build without gpu feature
  FEATURES: "jpeg,png,webp,pdf"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p agno -- --check

      - name: Clippy
        run: cargo clippy -p agno --no-default-features --features $FEATURES -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p agno --no-default-features --features $FEATURES

      - name: Run tests
        run: cargo test -p agno --no-default-features --features $FEATURES
