name: Test

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # No GPU in CI — build without gpu feature
  FEATURES: "jpeg,png,webp,pdf"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Check C header is up-to-date
        run: |
          cargo install cbindgen
          cbindgen --crate agno --config agno/cbindgen.toml --output /tmp/agno.h 2>/dev/null
          diff bindings/go/agno/agno.h /tmp/agno.h || (echo "bindings/go/agno/agno.h is out of date — run 'just header'" && exit 1)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-script

      - name: Build
        run: ./build/sh/build-agno.bash libagno.a
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGNO_FEATURES: "jpeg,png,webp,pdf"

      - name: Verify output
        run: file libagno.a
