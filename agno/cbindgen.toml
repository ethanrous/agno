language = "C"
style = "type"
include_guard = "AGNO_H"

header = "/* Generated by cbindgen — do not edit manually */"

# AgnoImage contains ExifContext (which has HashMap — not representable in C).
# Go only accesses the first 5 fields via pointer, so we define a partial
# struct manually and exclude the auto-generated one.
after_includes = """

typedef struct {
  unsigned char *data;
  size_t len;
  uint64_t width;
  uint64_t height;
  uint64_t page_count;
  /* Remaining fields are Rust-internal — do not access from C */
} AgnoImage;
"""

[export]
include = ["ExifData", "GpsCoordinates", "AgnoBuffer"]
exclude = ["AgnoImage", "ExifContext", "Endian", "ExifValue", "CString", "MAX_COMPONENTS"]

# Map Rust feature flags to C defines. The Go bindings set these via CFLAGS
# so feature-gated functions are visible.
[defines]
"feature = jpeg" = "AGNO_JPEG"
"feature = webp" = "AGNO_WEBP"
"feature = pdf" = "AGNO_PDF"
"feature = gif" = "AGNO_GIF"
