[package]
name = "agno"
version = "0.1.0"
edition = "2024"

[lib]
name = "agno"
crate-type = ["lib", "staticlib"]

[dependencies]
anyhow = { version = "1.0.99", features = ["backtrace"] }
libc = "0.2.175"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
pdfium-render = { version = "0.8.35", features = ["static"], optional = true }
rayon = "1.11.0"
serde = { version = "^1.0.220", features = ["derive"] }
serde_json = "1.0.143"
miniz_oxide = { version = "0.8", optional = true }

# GPU dependencies (optional)
agno-gpu-shared = { path = "../agno-gpu-shared", features = ["std"], optional = true }
wgpu = { version = "23.0", features = ["spirv"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }

[build-dependencies]
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", optional = true }

[package.metadata.cross]
target = "x86_64-unknown-linux-musl"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
jpeg = []
png = ["dep:miniz_oxide"]
webp = []
pdf = ["dep:pdfium-render"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:agno-gpu-shared", "dep:spirv-builder"]
default = ["gpu", "jpeg", "png", "webp"]
